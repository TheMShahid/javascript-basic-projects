<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>03 Project | Review</title>

    <!-- font awesome cdn -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />

    <!-- css link -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <section class="container">
        <!-- title -->
        <div class="title">
          <h2>our services</h2>
          <div class="underline"></div>
        </div>
        <!-- end of title -->

        <!-- review -->
        <article class="review">
          <!-- img container -->
          <div class="img-container">
            <img src="./person-1.jpeg" id="person-img" alt="person-img" />
          </div>
          <h4 id="author">sara jones</h4>
          <p id="job">ux designer</p>
          <p id="info">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Molestias
            at asperiores, recusandae veniam doloremque repellat. Omnis esse
            ipsam corrupti aliquid!
          </p>
          <!-- prev and next btns -->
          <div class="button-container">
            <button type="button" class="prev-btn">
              <i class="fas fa-chevron-left"></i>
            </button>
            <button type="button" class="next-btn">
              <i class="fas fa-chevron-right"></i>
            </button>
          </div>

          <!-- random btn -->
          <button type="button" class="random-btn">suprise me</button>
        </article>
      </section>
    </main>

    <!-- review js -->
    <script src="./review.js"></script>
  </body>
</html>
