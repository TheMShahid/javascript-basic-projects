<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>08 Menu Project</title>

    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />

    <!-- styles -->
    <link rel="stylesheet" href="./style.css" />

    <body>
      <section class="menu">
        <!-- title -->
        <div class="title">
          <h2>our menu</h2>
          <div class="underline"></div>
        </div>

        <!-- filter buttons -->
        <div class="filter-buttons"></div>

        <!-- menu items -->
        <div class="section-center">
          <!-- single item -->
          <article class="menu-item">
            <img src="./menu-item.jpeg" alt="menu item" class="photo" />
            <div class="item-info">
              <header>
                <h4>buttermil pancakes</h4>
                <h4 class="price">$44</h4>
              </header>
              <p class="item-text">
                Lorem ipsum dolor sit, amet consectetur adipisicing elit.
                Aperiam doloremque nulla optio magni. Repudiandae, eum similique
                nihil reprehenderit doloribus dolore.
              </p>
            </div>
          </article>
          <!-- end of single item -->
        </div>
      </section>

      <!-- script -->
      <script src="./script.js"></script>
    </body>
  </head>
</html>
